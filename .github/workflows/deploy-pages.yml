name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install website dependencies
        if: hashFiles('website/package-lock.json') != ''
        run: |
          cd website
          npm ci

      - name: Install digital awareness dependencies
        if: hashFiles('digital_awareness/package-lock.json') != ''
        run: |
          cd digital_awareness
          npm ci

      - name: Assemble Pages site
        run: |
          mkdir -p _site/digital-awareness _site/branding
          # Main website at the site root
          cp -R website/. _site/
          # Inline shared constants into the website stylesheet so no relative
          # @import path can escape the /Future-Mall/ site prefix on Pages
          cat shared/constants.css > _site/style.css
          echo "" >> _site/style.css
          grep -v '^@import' website/style.css >> _site/style.css
          # Digital awareness under /digital-awareness/
          cp -R digital_awareness/. _site/digital-awareness/
          # Inline shared constants for digital awareness too
          cat shared/constants.css > _site/digital-awareness/style.css
          echo "" >> _site/digital-awareness/style.css
          grep -v '^@import' digital_awareness/style.css >> _site/digital-awareness/style.css
          # Brand assets (referenced by the website's brand section)
          cp -R branding/. _site/branding/
          cp LICENSE _site/LICENSE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4