<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="794" height="1123" fill="url(#bg)"/>
  <rect x="40" y="40" width="714" height="1043" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" rx="8"/>
  <text x="397" y="150" font-family="Space Grotesk, sans-serif" font-size="120" text-anchor="middle" fill="#ffffff">🔐</text>
  <text x="397" y="300" font-family="Space Grotesk, sans-serif" font-size="64" font-weight="700" text-anchor="middle" fill="#ffffff">Protect Your Password</text>
  <text x="397" y="380" font-family="Inter, sans-serif" font-size="34" text-anchor="middle" fill="#99f6e4">12+ chars. Mixed case. Numbers. Symbols. Unique per site.</text>
