name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install website dependencies
        if: hashFiles('future-mall-capstone/website/package-lock.json') != ''
        run: |
          cd future-mall-capstone/website
          npm ci

      - name: Install digital awareness dependencies
        if: hashFiles('future-mall-capstone/digital_awareness/package-lock.json') != ''
        run: |
          cd future-mall-capstone/digital_awareness
          npm ci

      - name: Assemble Pages site
        run: |
          mkdir -p _site/digital-awareness _site/branding
          # Main website at the site root
          cp -R future-mall-capstone/website/. _site/
          # Digital awareness under /digital-awareness/
          cp -R future-mall-capstone/digital_awareness/. _site/digital-awareness/
          # Brand assets (referenced by the website's brand section)
          cp -R future-mall-capstone/branding/. _site/branding/
          cp future-mall-capstone/LICENSE _site/LICENSE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4